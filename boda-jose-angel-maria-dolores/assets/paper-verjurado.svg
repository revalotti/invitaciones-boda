<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <defs>
    <!-- Base cream -->
    <linearGradient id="base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f5f0"/>
      <stop offset="50%" style="stop-color:#f5efe6"/>
      <stop offset="100%" style="stop-color:#f0eae0"/>
    </linearGradient>
    <!-- Laid lines - horizontal, fine, closely spaced -->
    <pattern id="laid" width="6" height="3" patternUnits="userSpaceOnUse">
      <line x1="0" y1="1.5" x2="6" y2="1.5" stroke="rgba(0,0,0,0.035)" stroke-width="0.4"/>
    </pattern>
    <!-- Chain lines - vertical, slightly wider spaced -->
    <pattern id="chain" width="24" height="300" patternUnits="userSpaceOnUse">
      <line x1="12" y1="0" x2="12" y2="300" stroke="rgba(0,0,0,0.025)" stroke-width="0.6"/>
    </pattern>
    <!-- Subtle grain for embossed feel -->
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="2" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.04"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="300" height="300" fill="url(#base)"/>
  <rect width="300" height="300" fill="url(#laid)"/>
  <rect width="300" height="300" fill="url(#chain)"/>
  <rect width="300" height="300" filter="url(#grain)" opacity="0.6"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 240" fill="none">
  <!-- Corner monument: column + arch (aqueduct / forum) -->
  <g stroke="#8b3a2f" stroke-width="1.2" fill="none" opacity="0.32">
    <!-- Base plinth -->
    <rect x="18" y="210" width="56" height="10"/>
    <rect x="14" y="220" width="64" height="8"/>
    <!-- Column shaft -->
    <line x1="32" y1="210" x2="32" y2="70"/>
    <line x1="46" y1="210" x2="46" y2="70"/>
    <line x1="60" y1="210" x2="60" y2="70"/>
    <!-- Capital -->
    <rect x="22" y="58" width="48" height="12"/>
    <rect x="18" y="50" width="56" height="8"/>
    <!-- Entablature extending right -->
    <line x1="18" y1="50" x2="168" y2="50"/>
    <line x1="18" y1="42" x2="168" y2="42"/>
    <rect x="18" y="34" width="150" height="8"/>
    <!-- Pediment tip -->
    <line x1="18" y1="34" x2="93" y2="8"/>
    <line x1="168" y1="34" x2="93" y2="8"/>
    <!-- Arch arcade to the right -->
    <path d="M78 210 V130 A28 28 0 0 1 134 130 V210"/>
    <path d="M88 210 V138 A18 18 0 0 1 124 138 V210"/>
    <line x1="134" y1="50" x2="134" y2="210"/>
    <line x1="148" y1="50" x2="148" y2="210"/>
    <rect x="126" y="210" width="30" height="10"/>
    <rect x="122" y="220" width="38" height="8"/>
  </g>
</svg>
